<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luis and Apo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <div class="deco-strip">
      <img class="deco-image deco-top-left" src="https://placehold.co/225x325/ffd6ea/ff4fa3?text=Foto" alt="Deko Bild">
      <img class="deco-image deco-top-right" src="https://placehold.co/225x325/ffd6ea/ff4fa3?text=Foto" alt="Deko Bild">
      <img class="deco-image deco-mid-left" src="https://placehold.co/225x325/ffd6ea/ff4fa3?text=Foto" alt="Deko Bild">
      <img class="deco-image deco-mid-right" src="https://placehold.co/225x325/ffd6ea/ff4fa3?text=Foto" alt="Deko Bild">
      <img class="deco-image deco-bottom-left" src="https://placehold.co/225x325/ffd6ea/ff4fa3?text=Foto" alt="Deko Bild">
      <img class="deco-image deco-bottom-right" src="https://placehold.co/225x325/ffd6ea/ff4fa3?text=Foto" alt="Deko Bild">
      <img class="deco-image deco-mid-top-left" src="https://placehold.co/225x325/ffd6ea/ff4fa3?text=GIF" alt="Deko Bild">
      <img class="deco-image deco-mid-top-right" src="https://placehold.co/225x325/ffd6ea/ff4fa3?text=GIF" alt="Deko Bild">
    </div>

    <div class="quiz-card">
      <img class="quiz-image" src="https://placehold.co/480x300/ffd6ea/ff4fa3?text=GIF" alt="Quiz Bild">

      <h2 class="quiz-question">CAN I BE THE BF OF THE APO-CALYPSE🥰?</h2>

      <div class="answers">
        <button class="answer-btn" id="btn-a" data-answer="a">Yessssss!</button>
        <button class="answer-btn" id="btn-b" data-answer="b">Nooooo</button>
        <button class="answer-btn" id="btn-c" data-answer="c">Maybe</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
