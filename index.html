<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luis and Apo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <div class="deco-strip">
      <img class="deco-image deco-top-left" src="Bilder/IMG_2209.JPG" alt="Deko Bild">
      <img class="deco-image deco-top-right" src="Bilder/IMG_2599.JPG" alt="Deko Bild">
      <img class="deco-image deco-mid-left" src="Bilder/IMG_2601.JPG" alt="Deko Bild">

      <img class="deco-image deco-mid-top-left" src="Bilder/Carlos Sainz Williams GIF.gif" alt="Deko Bild">
      <img class="deco-image deco-mid-top-right" src="Bilder/Cat Cuddle GIF.gif" alt="Deko Bild">
    </div>

      <img class="quiz-image" src="GIF by PopJam.gif" alt="Quiz Bild">

      <div class="answers">

        <button class="answer-btn" id="btn-c" data-answer="c">Maybe</button>
